name: Publish latest demo artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-latest-demo-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo repo
        uses: actions/checkout@v4

      - name: Download tested demo build
        run: |
          curl -fL 'https://sdmntprwestus.oaiusercontent.com/files/00000000-7e04-8230-aaf7-65c5f2b83564/raw?se=2026-10-06T16%3A27%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=a8580974-16ce-5ff4-bb27-40d273fdc007&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T16%3A09%3A46Z&ske=2026-10-07T16%3A09%3A46Z&sks=b&skv=2026-02-06&sig=jd4HG6HM8n7Rjnr42COkrj/hhCD0Ov2xxtPdn09E52c%3D' -o /tmp/callosum-demo.zip
          rm -rf /tmp/callosum-demo
          mkdir -p /tmp/callosum-demo
          unzip -q /tmp/callosum-demo.zip -d /tmp/callosum-demo

      - name: Replace generated site
        run: |
          rm -rf assets fonts
          rm -f index.html manifest.webmanifest sw.js icon.svg favicon.svg
          cp -R /tmp/callosum-demo/. .
          touch .nojekyll

      - name: Commit published build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish latest Callosum demo build" || exit 0
          git push
