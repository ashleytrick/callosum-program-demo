name: Publish latest demo artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-latest-demo-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo repo
        uses: actions/checkout@v4

      - name: Download tested demo build
        run: |
          curl -fL 'https://sdmntprwestus.oaiusercontent.com/files/00000000-63ec-8230-8eb3-c66db2c3615d/raw?se=2026-10-06T16%3A22%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=f2e1e7b7-9a89-5905-9ed3-0857d57cfdb2&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A58%3A18Z&ske=2026-10-07T01%3A58%3A18Z&sks=b&skv=2026-02-06&sig=XzJeOYWAQxK/y1W8RVG2QgC2EoxNKLtHPpgAq0RJpXQ%3D' -o /tmp/callosum-demo.zip
          rm -rf /tmp/callosum-demo
          mkdir -p /tmp/callosum-demo
          unzip -q /tmp/callosum-demo.zip -d /tmp/callosum-demo

      - name: Replace generated site
        run: |
          rm -rf assets fonts
          rm -f index.html manifest.webmanifest sw.js icon.svg favicon.svg
          cp -R /tmp/callosum-demo/. .
          touch .nojekyll

      - name: Commit published build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish latest Callosum demo build" || exit 0
          git push
