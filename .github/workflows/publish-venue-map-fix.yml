name: Publish venue map fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-venue-map-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tested build
        run: |
          curl -fL 'https://sdmntprwestus.oaiusercontent.com/files/00000000-b968-8230-8f2a-1e937046e930/raw?se=2026-10-06T16%3A39%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=5640e0a5-da6e-5dbf-81ee-3468d704864b&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T15%3A57%3A32Z&ske=2026-10-07T15%3A57%3A32Z&sks=b&skv=2026-02-06&sig=7Bv3i1HNQdHaRtEDckMMYn0T7eXGeIed9vxa%2BUGd0%2Bo%3D' -o /tmp/demo.zip
          rm -rf /tmp/demo
          mkdir -p /tmp/demo
          unzip -q /tmp/demo.zip -d /tmp/demo

      - name: Replace generated site
        run: |
          rm -rf assets fonts
          rm -f index.html manifest.webmanifest sw.js icon.svg favicon.svg
          cp -R /tmp/demo/. .
          touch .nojekyll

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish venue map fix" || exit 0
          git push
